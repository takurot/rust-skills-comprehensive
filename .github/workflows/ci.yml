name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck install.sh and scripts/*.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck (warning severity — see docs/WORKFLOW.md §5)
        run: shellcheck --severity=warning install.sh scripts/*.sh

  skill-frontmatter:
    name: Skill frontmatter and line budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md frontmatter and line budget
        run: ./scripts/check-skill-frontmatter.sh

  install-list-sync:
    name: install.sh --list matches skills/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh --list vs skills/ directories
        run: ./scripts/check-install-list-sync.sh

  link-check:
    name: Skill/docs cross-reference links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links and [[name]] references
        run: ./scripts/check-links.sh

  markdown-lint:
    name: Markdown lint (heading structure, code fence language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            skills/**/*.md
            docs/**/*.md
            README.md
            CONTRIBUTING.md

  install-smoke-test:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: --list
        run: ./install.sh --list
      - name: copy install
        run: ./install.sh --dest /tmp/rsc-install-test rust-api-design
      - name: symlink install
        run: ./install.sh --dest /tmp/rsc-install-test-symlink --symlink rust-api-design
      - name: re-run without --force is skipped (no error, no overwrite)
        run: ./install.sh --dest /tmp/rsc-install-test rust-api-design
      - name: --force overwrites
        run: ./install.sh --dest /tmp/rsc-install-test --force rust-api-design
      - name: installed file is present and non-empty
        run: test -s /tmp/rsc-install-test/.claude/skills/rust-api-design/SKILL.md
      - name: reject path-traversal skill names (issue #44)
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsc-traversal-canary
          touch /tmp/rsc-traversal-canary/marker
          for bad_name in ".." "../../etc" "a/b" "."; do
            out="$(./install.sh --dest /tmp/rsc-traversal-test --force "$bad_name" 2>&1)" && rc=0 || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "expected non-zero exit for skill name: $bad_name" >&2
              exit 1
            fi
            # Assert the *new* guard's own message fired, not just any non-zero exit —
            # some of these names (e.g. "..") are also independently blocked by rm's own
            # "refusing to remove '.' or '..'" guard, or by the pre-existing "no such
            # skill" check for a name that never resolves to a real directory, so a bare
            # exit-code check here would still pass green even with the guard removed
            # (code review on PR #51 caught this).
            if [[ "$out" != *"invalid skill name"* ]]; then
              echo "expected the path-traversal guard's own error for skill name: $bad_name" >&2
              echo "$out" >&2
              exit 1
            fi
          done
          # The canary must survive every attempt above — a regression here means a
          # traversal name reached rm -rf instead of being rejected up front.
          test -f /tmp/rsc-traversal-canary/marker
